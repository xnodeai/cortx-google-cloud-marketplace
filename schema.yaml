properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
  installerServiceAccount:
    type: string
    title: Installer service account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: >-
          Runs the Cortx Helm installer. Cortx is a multi-namespace platform with operators
          (CloudNativePG, Redis, RabbitMQ, Prometheus): the install creates its namespaces, CRDs,
          RBAC, admission webhooks and workloads, and removes them on uninstall.
          Helm must hold every permission it grants in those operator ClusterRoles, so the
          rules cover all API groups with explicitly listed verbs, plus escalate/bind on RBAC roles.
        roles:
        - type: ClusterRole
          rulesType: CUSTOM
          rules:
          - apiGroups: ['*']
            resources: ['*']
            verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete', 'deletecollection']
          - apiGroups: ['rbac.authorization.k8s.io']
            resources: ['clusterroles', 'roles']
            verbs: ['escalate', 'bind']
  domain:
    type: string
    title: 'Domain'
    description: 'Base domain for Cortx; every service is served as <name>.<domain> (e.g. cortx.example.com).'
    pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  webHost:
    type: string
    title: 'Web host (optional)'
    description: 'Hostname for the Cortx web app. Default: <environment name>.<domain>, e.g. prod.cortx.example.com.'
  envName:
    type: string
    title: 'Environment name'
    description: 'Short environment name.'
    default: 'prod'
    pattern: '^[a-z0-9-]{2,20}$'
  tls.cert:
    type: string
    title: 'Wildcard TLS certificate (base64)'
    description: 'base64 of the PEM certificate (with chain) for *.<domain>: base64 -w0 fullchain.pem'
    x-google-marketplace:
      type: MASKED_FIELD
  tls.key:
    type: string
    title: 'Wildcard TLS private key (base64)'
    description: 'base64 of the PEM private key: base64 -w0 privkey.pem'
    x-google-marketplace:
      type: MASKED_FIELD
  licenseSecretName:
    type: string
    title: 'License secret'
    description: 'Secret in this namespace holding your Cortx license bundle (key: bundle): kubectl create secret generic cortx-license-bundle -n <namespace> --from-file=bundle=<file>. Without it, the platform is installed and the Cortx apps are added automatically once the Secret exists.'
    default: 'cortx-license-bundle'
  llm.openaiKey:
    type: string
    title: 'OpenAI API key'
    description: 'OpenAI API key used by Cortx.'
    x-google-marketplace:
      type: MASKED_FIELD
  authType:
    type: string
    title: 'Sign-in method'
    description: 'How users sign in.'
    default: 'XNODE'
    enum:
    - 'XNODE'
    - 'LDAP_SSO'
    - 'ENTRA_ID_SSO'
    - 'CYBERARK'
  admin.email:
    type: string
    title: 'Admin email'
    description: 'First administrator''s email.'
  admin.firstName:
    type: string
    title: 'Admin first name'
    description: 'First administrator''s first name.'
  admin.lastName:
    type: string
    title: 'Admin last name'
    description: 'First administrator''s last name.'
  admin.mobile:
    type: string
    title: 'Admin mobile number'
    description: 'Digits, spaces, + and - only.'
    pattern: '^[0-9+ -]{7,20}$'
  admin.entityName:
    type: string
    title: 'Organization name'
    description: 'Your organization''s name.'
  admin.accountName:
    type: string
    title: 'Account name'
    description: 'Short account name, 3-40 characters.'
    pattern: '^.{3,40}$'
  admin.country:
    type: string
    title: 'Country code'
    description: 'Two-letter country code, e.g. US.'
    default: 'US'
    pattern: '^[A-Z]{2}$'
  microsoft.tenantId:
    type: string
    title: 'Microsoft tenant ID (optional)'
    description: 'Entra ID tenant; empty = common.'
  microsoft.botClientId:
    type: string
    title: 'Teams bot client ID (optional)'
    description: 'Teams bot client ID (optional)'
