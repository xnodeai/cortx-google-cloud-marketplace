apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-installer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: installer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/component: installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: installer
      annotations:
        checksum/values: {{ include (print $.Template.BasePath "/values-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.installerServiceAccount }}
      # helm uninstall runs from the TERM trap when the Application is deleted.
      terminationGracePeriodSeconds: 3600
      containers:
        - name: installer
          image: "{{ .Values.installer.image.repository }}:{{ .Values.installer.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_NAME
              value: {{ .Release.Name | quote }}
            - name: LICENSE_SECRET
              value: {{ .Values.licenseSecretName | quote }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: values
              mountPath: /values
              readOnly: true
      volumes:
        - name: values
          secret:
            secretName: {{ .Release.Name }}-values
