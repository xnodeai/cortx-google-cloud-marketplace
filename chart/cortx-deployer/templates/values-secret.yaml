{{- /*
Values for the inner Cortx chart, the GCP equivalent of the Azure extension's
configurationSettings / configurationProtectedSettings (azure-marketplace/mainTemplate.json).
Image locations come from schema.yaml image properties, which Marketplace points at its own registry.
*/ -}}
{{- $v := .Values -}}
{{- $images := dict -}}
{{- range $key, $img := $v.images }}
{{- $_ := set $images $key (dict "repository" $img.repository "tag" $img.tag) }}
{{- end }}
{{- $tlsUpload := and (not (empty $v.tls.cert)) (not (empty $v.tls.key)) -}}
{{- $inner := dict
  "global" (dict
    "envName" $v.envName
    "domain" $v.domain
    "webHost" $v.webHost
    "ingressClass" "traefik"
    "tlsMode" (ternary "upload" "" $tlsUpload)
    "tlsSecret" (ternary "wildcard-tls" "" $tlsUpload)
    "licenseSecretName" "cortx-license"
    "apiKey" $v.apiKeys.internal
    "azure" (dict "images" $images))
  "traefik" (dict "image" (dict "registry" $v.traefik.image.registry "repository" $v.traefik.image.repository "tag" $v.traefik.image.tag))
  "nfs-server-provisioner" (dict "image" (dict "repository" $v.nfs.image.repository "tag" $v.nfs.image.tag))
  "cortx-apps" (dict
    "onboarding" (dict
      "adminEmail" $v.admin.email "firstName" $v.admin.firstName "lastName" $v.admin.lastName
      "mobileNumber" $v.admin.mobile "entityName" $v.admin.entityName "accountName" $v.admin.accountName
      "country" $v.admin.country "countryCode" $v.admin.country)
    "slack-api" (dict "enabled" (ternary "true" "false" (not (empty $v.slack.clientId))))
    "transcription-api" (dict "enabled" (ternary "true" "false" (not (empty $v.llm.whisperEndpoint)))))
  "cortx-platform" (dict "secrets" (dict
    "authType" $v.authType
    "passwords" $v.passwords
    "apiKeys" $v.apiKeys
    "llm" (dict "openaiKey" $v.llm.openaiKey "claudeKey" $v.llm.claudeKey "whisperEndpoint" $v.llm.whisperEndpoint "whisperKey" $v.llm.whisperKey)
    "microsoft" (dict
      "tenantId" ($v.microsoft.tenantId | default "common")
      "botClientId" $v.microsoft.botClientId "botClientSecret" $v.microsoft.botClientSecret
      "teamsAppId" $v.microsoft.teamsAppId "teamsAppPassword" $v.microsoft.teamsAppPassword
      "onedriveClientId" $v.microsoft.onedriveClientId "onedriveClientSecret" $v.microsoft.onedriveClientSecret)
    "ldap" (dict
      "enabled" (ternary "true" "false" (not (empty $v.ldap.url)))
      "url" $v.ldap.url "base" $v.ldap.base "username" $v.ldap.username "password" $v.ldap.password
      "domain" $v.ldap.domain "requiredGroup" $v.ldap.requiredGroup "userSearchBase" $v.ldap.userSearchBase
      "searchBase" $v.ldap.searchBase "groupBase" $v.ldap.groupBase "sslEnable" $v.ldap.sslEnable "sslCert" $v.ldap.sslCert)
    "smtp" (dict "host" $v.smtp.host "port" $v.smtp.port "from" $v.smtp.from)
    "slack" (dict "clientId" $v.slack.clientId "clientSecret" $v.slack.clientSecret "signingSecret" $v.slack.signingSecret)
    "ingressTls" (dict "certB64" $v.tls.cert "keyB64" $v.tls.key)))
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-values
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
type: Opaque
stringData:
  values.yaml: |
{{ toYaml $inner | indent 4 }}
